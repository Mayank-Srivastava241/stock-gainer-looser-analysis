<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Stock Comparison</title>

<style>
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: #0b1220;
    color: #e5e7eb;
    padding: 14px;
  }

  h1 {
    font-size: 1.4rem;
    margin-bottom: 4px;
  }

  .subtitle {
    font-size: 0.8rem;
    color: #9ca3af;
    margin-bottom: 16px;
  }

  .section {
    background: #111827;
    border: 1px solid #1f2937;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 14px;
  }

  .section h2 {
    font-size: 1rem;
    margin: 0 0 10px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .count {
    font-size: 0.75rem;
    color: #9ca3af;
  }

  ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  li {
    padding: 10px 12px;
    background: #020617;
    border-radius: 10px;
    margin-bottom: 8px;
    font-size: 0.9rem;
  }

  li:last-child {
    margin-bottom: 0;
  }

  footer {
    text-align: center;
    font-size: 0.7rem;
    color: #9ca3af;
    margin-top: 20px;
  }
</style>
</head>

<body>

<h1>📊 Daily Stock Comparison</h1>
<div class="subtitle">Auto-updated • Vertical list view</div>

<div id="content">Loading…</div>

<footer>Generated automatically via GitHub Actions</footer>

<script>
async function loadCSV() {
  const res = await fetch("comparison_result.csv?ts=" + Date.now());
  const text = await res.text();

  const rows = text.trim().split("\n").map(r => r.split(","));
  const headers = rows[0];
  const data = rows.slice(1);

  let sections = {};
  headers.forEach(h => sections[h] = []);

  data.forEach(row => {
    row.forEach((cell, i) => {
      const value = cell.trim();
      if (value) sections[headers[i]].push(value);
    });
  });

  let html = "";

  for (const key in sections) {
    html += `
      <div class="section">
        <h2>${key} <span class="count">${sections[key].length}</span></h2>
        <ul>
          ${sections[key].map(v => `<li>${v}</li>`).join("")}
        </ul>
      </div>
    `;
  }

  document.getElementById("content").innerHTML = html;
}

loadCSV();
</script>

</body>
</html>
