<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Comparison</title>

  <style>
    :root {
      --bg: #0b1220;
      --card: #111827;
      --border: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --green: #22c55e;
      --red: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 14px;
    }

    header {
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.3rem;
      margin: 0;
    }

    .subtitle {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .row:last-child {
      margin-bottom: 0;
    }

    .label {
      color: var(--muted);
      font-size: 0.75rem;
    }

    .value {
      font-weight: 600;
    }

    .pos { color: var(--green); }
    .neg { color: var(--red); }

    .loading {
      text-align: center;
      color: var(--muted);
      margin-top: 40px;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.7rem;
      margin-top: 20px;
    }

    @media (min-width: 768px) {
      body {
        max-width: 900px;
        margin: auto;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>📊 Daily Stock Comparison</h1>
    <div class="subtitle">Auto-updated • Mobile friendly</div>
  </header>

  <div id="content" class="loading">
    Loading data…
  </div>

  <footer>
    Generated automatically via GitHub Actions
  </footer>

  <script>
    async function loadData() {
      const res = await fetch("Data/comparison_result.csv");
      const text = await res.text();

      const rows = text.trim().split("\n").map(r => r.split(","));
      const headers = rows[0];
      const data = rows.slice(1);

      let html = "";

      data.forEach(row => {
        html += `<div class="card">`;

        row.forEach((cell, i) => {
          const val = cell.trim();
          let cls = "value";

          if (!isNaN(val)) {
            if (parseFloat(val) > 0) cls += " pos";
            if (parseFloat(val) < 0) cls += " neg";
          }

          html += `
            <div class="row">
              <div class="label">${headers[i]}</div>
              <div class="${cls}">${val}</div>
            </div>
          `;
        });

        html += `</div>`;
      });

      document.getElementById("content").innerHTML = html;
    }

    loadData();
  </script>

</body>
</html>
