<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Stock Comparison</title>

<style>
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: #0b1220;
    color: #e5e7eb;
    padding: 14px;
  }

  h1 {
    font-size: 1.4rem;
    margin-bottom: 4px;
  }

  .subtitle {
    font-size: 0.8rem;
    color: #9ca3af;
    margin-bottom: 14px;
  }

  .table-wrapper {
    background: #111827;
    border: 1px solid #1f2937;
    border-radius: 14px;
    overflow-x: auto;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 520px; /* critical for mobile */
  }

  thead {
    background: #020617;
    position: sticky;
    top: 0;
    z-index: 1;
  }

  th, td {
    padding: 10px 8px;
    text-align: center;
    border-bottom: 1px solid #1f2937;
    font-size: 0.85rem;
    white-space: nowrap;
  }

  th {
    font-size: 0.75rem;
    text-transform: uppercase;
    color: #9ca3af;
  }

  tbody tr:last-child td {
    border-bottom: none;
  }

  .pos {
    color: #22c55e;
    font-weight: 600;
  }

  .neg {
    color: #ef4444;
    font-weight: 600;
  }

  footer {
    text-align: center;
    font-size: 0.7rem;
    color: #9ca3af;
    margin-top: 18px;
  }
</style>
</head>

<body>

<h1>📊 Daily Stock Comparison</h1>
<div class="subtitle">Auto-updated • Scroll sideways if needed</div>

<div class="table-wrapper">
  <table id="table">
    <thead></thead>
    <tbody></tbody>
  </table>
</div>

<footer>Generated automatically via GitHub Actions</footer>

<script>
async function loadCSV() {
  const res = await fetch("Data/comparison_result.csv?ts=" + Date.now());
  const text = await res.text();

  const rows = text.trim().split("\n").map(r => r.split(","));
  const headers = rows[0];
  const data = rows.slice(1);

  const thead = document.querySelector("#table thead");
  const tbody = document.querySelector("#table tbody");

  thead.innerHTML = `
    <tr>
      ${headers.map(h => `<th>${h}</th>`).join("")}
    </tr>
  `;

  tbody.innerHTML = "";

  data.forEach(row => {
    let tr = "<tr>";
    row.forEach(cell => {
      const val = cell.trim();
      let cls = "";

      if (!isNaN(val)) {
        if (parseFloat(val) > 0) cls = "pos";
        if (parseFloat(val) < 0) cls = "neg";
      }

      tr += `<td class="${cls}">${val || "-"}</td>`;
    });
    tr += "</tr>";
    tbody.innerHTML += tr;
  });
}

loadCSV();
</script>

</body>
</html>
